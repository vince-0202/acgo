name: Build and Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag on main
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "tag_name=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Ensure tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tagged commit ${GITHUB_SHA} is not contained in origin/main"
            exit 1
          fi

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - runner: windows-latest
            goos: windows
            goarch: arm64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist"
          mkdir -p "${DIST}"
          BIN_NAME="acgo-${{ matrix.goos }}-${{ matrix.goarch }}"
          BIN_PATH="${DIST}/${BIN_NAME}${{ matrix.ext }}"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "${BIN_PATH}" \
            ./cmd/acgo

          ARCHIVE="${DIST}/${BIN_NAME}.tar.gz"
          tar -C "${DIST}" -czf "${ARCHIVE}" "${BIN_NAME}${{ matrix.ext }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release and upload assets
    runs-on: ubuntu-latest
    needs:
      - validate
      - build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          name: ${{ needs.validate.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*
